name: GitHub Pages'e Dağıt

# Her push'ta build alınır (geliştirme dallarında da kod doğrulanır); Pages'e
# yayınlama yalnız main'de yapılır (dev dalları tek Pages ortamına yarışıp
# deploy'u patlatmasın). Pages: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek dağıtım; yenisi gelince eskisini iptal et
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # yalnız main yayınlanır; dev dallarında deploy atlanır (CI yeşil kalır)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
